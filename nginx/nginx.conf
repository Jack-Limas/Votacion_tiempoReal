worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 65535;
}

http {
  access_log off;

  # DNS interno de Docker: "app" resuelve a las 8 réplicas. Con "resolve" nginx
  # vuelve a consultar el nombre si las réplicas se recrean.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    # Round robin puro: sin ip_hash ni cookies, es decir, sin sesiones pegajosas.
    server app:3000 resolve;
    keepalive 64;
  }

  server {
    listen 80;

    location /stream {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # SSE: sin búfer en el proxy para que cada mensaje salga de inmediato.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
