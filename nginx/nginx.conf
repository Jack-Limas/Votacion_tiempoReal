worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 65535;
}

http {
  access_log off;
  server_tokens off;

  # Docker internal DNS: "app" resolves to every replica. With "resolve" nginx
  # re-queries the name when replicas are recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    # Plain round robin: no ip_hash and no cookies, i.e. no sticky sessions (RT-2).
    # A replica is only taken out after 3 failures within 5 s: one connect
    # timeout during a reconnection burst must not empty the pool
    # ("no live upstreams" for every client).
    server app:3000 resolve max_fails=3 fail_timeout=5s;
    keepalive 64;
  }

  # WebSocket upgrade: forward the Upgrade header only when the client sent it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Retry another replica only for idempotent requests that never reached
    # the app (a dead instance), never for a POST that may have been applied.
    proxy_next_upstream error timeout;
    proxy_connect_timeout 5s;

    location = /nginx-health {
      return 200 "ok\n";
    }

    # WebSocket endpoints: /ws and /ws/verification.
    location /ws {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Every endpoint sends heartbeats; silence means the instance is gone.
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Server-Sent Events: no proxy buffering so every frame leaves at once.
    location /stream {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      # The app sends a heartbeat every 10 s. 30 s of silence means the
      # instance died without closing the socket (a killed container sends no
      # FIN/RST): nginx then closes the client side so it reconnects.
      proxy_read_timeout 30s;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
